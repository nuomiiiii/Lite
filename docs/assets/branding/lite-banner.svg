<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800" role="img" aria-labelledby="title desc">
  <title id="title">Lite banner with online status logo</title>
  <desc id="desc">Lite brand banner using the selected three-tile L mark with an integrated green online node.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#EEF1F3" stroke-width="2"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#1E2933" flood-opacity=".08"/></filter>
    <filter id="cardShadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E2933" flood-opacity=".11"/></filter>
  </defs>
  <rect width="2400" height="800" fill="#FFFFFF"/>
  <rect width="2400" height="800" fill="url(#grid)" opacity=".42"/>
  <path d="M0 650C350 600 540 715 820 656C1090 600 1250 528 1530 584C1830 644 2070 526 2400 570V800H0Z" fill="#F8FAFB"/>
  <g transform="translate(146 150)" filter="url(#shadow)">
    <rect width="500" height="500" rx="112" fill="#F7F9FB" stroke="#E5E9ED" stroke-width="6"/>
    <rect x="103" y="103" width="142" height="142" rx="38" fill="#202A33"/>
    <rect x="103" y="255" width="142" height="142" rx="38" fill="#FF6B5E"/>
    <rect x="255" y="255" width="142" height="142" rx="38" fill="#0E86DD"/>
    <circle cx="327" cy="174" r="34" fill="#DDF7E8"/>
    <circle cx="327" cy="174" r="20" fill="#22B573"/>
  </g>
  <g transform="translate(770 204)">
