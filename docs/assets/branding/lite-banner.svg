    <text x="10" y="302" fill="#5F6B73" font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif" font-size="43">轻量、自托管的服务器监控与管理工具</text>
    <g transform="translate(12 366)">
      <text x="0" y="28" fill="#879198" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">LIGHTWEIGHT</text><circle cx="246" cy="18" r="6" fill="#0E86DD"/>
      <text x="276" y="28" fill="#879198" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">SELF-HOSTED</text><circle cx="530" cy="18" r="6" fill="#CDD3D7"/>
      <text x="560" y="28" fill="#879198" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">REAL-TIME</text>
    </g>
  </g>
  <g>
    <circle cx="2250" cy="72" r="446" fill="#202A33"/>
    <circle cx="2250" cy="72" r="348" fill="none" stroke="#36515A" stroke-width="4" opacity=".72"/>
    <circle cx="2250" cy="72" r="260" fill="none" stroke="#36515A" stroke-width="4" opacity=".72"/>
    <path d="M1664 538C1772 492 1833 526 1918 454C2000 384 2070 402 2142 342C2218 279 2224 190 2312 128C2344 106 2374 90 2400 79" fill="none" stroke="#0E86DD" stroke-width="26" stroke-linecap="round"/>
    <circle cx="2198" cy="228" r="46" fill="none" stroke="#FF6B5E" stroke-width="7" opacity=".34"/>
    <circle cx="2198" cy="228" r="25" fill="#FF6B5E"/>
    <circle cx="2304" cy="92" r="18" fill="#F2C14E"/>
