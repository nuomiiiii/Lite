      <circle cx="54" cy="58" r="14" fill="#0E86DD"/>
      <text x="88" y="68" fill="#46525A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">LIVE STATUS</text>
      <text x="52" y="137" fill="#18232C" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">24 / 24</text>
      <text x="252" y="136" fill="#879198" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">ONLINE</text>
      <rect x="52" y="164" width="306" height="11" rx="6" fill="#E8ECEF"/>
      <rect x="52" y="164" width="270" height="11" rx="6" fill="#0E86DD"/>
