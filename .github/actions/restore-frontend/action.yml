name: Restore system UI
description: Download and unpack a previously built theme-independent system UI artifact.

inputs:
  artifact-name:
    description: System UI artifact name.
    default: lite-frontend

runs:
  using: composite
  steps:
    - name: Download frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/frontend-artifact

    - name: Extract frontend artifact
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf web/public/systemUI
        mkdir -p web/public/systemUI
        tar -xzf "$RUNNER_TEMP/frontend-artifact/${{ inputs.artifact-name }}.tar.gz" -C web/public/systemUI
        grep -F '/system-assets/' web/public/systemUI/dist/index.html
