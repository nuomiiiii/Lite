name: Build system UI
description: Clone komari-web, build the theme-independent system UI, and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "24"
  repository:
    description: komari-web repository URL.
    default: https://github.com/nuomiiiii/komari-web
  ref:
    description: Optional komari-web ref to build. Uses the repository default branch when empty.
    default: main
  artifact-name:
    description: Optional artifact name for the packed system UI.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Clone and build system UI
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf komari-web
        if [ -n "${{ inputs.ref }}" ]; then
          git clone --depth=1 --branch "${{ inputs.ref }}" "${{ inputs.repository }}" komari-web
        else
          git clone --depth=1 "${{ inputs.repository }}" komari-web
        fi
        cd komari-web
        npm ci
        VITE_SYSTEM_UI_BUILD=1 VITE_BASE_URL=/system-assets/ npm run build
        cd ..

        rm -rf web/public/systemUI
        mkdir -p web/public/systemUI
        cp -r komari-web/dist web/public/systemUI/

        grep -F '/system-assets/' web/public/systemUI/dist/index.html
        test -f web/public/bundledThemes/nezha/komari-theme.json
        test -f web/public/bundledThemes/nezha/dist/index.html
        test -f web/public/rescueTheme/dist/index.html

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/systemUI .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
