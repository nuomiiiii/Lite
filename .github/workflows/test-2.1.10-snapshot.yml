name: Build Komari 2.1.10 Snapshot Image

on:
  push:
    branches:
      - test-2.1.10-snapshot
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: 2.1.10-snapshot
  VERSION_HASH: n4v7c2p
  IMAGE_TAG: 2.1.10-snapshot

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

  build-linux:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            zig_target: x86_64-linux-musl
          - goarch: arm64
            zig_target: aarch64-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run full regression suite
        if: matrix.goarch == 'amd64'
        run: go test ./...

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build Linux ${{ matrix.goarch }} binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
        shell: bash
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"
          go build -trimpath -ldflags="$LDFLAGS" -o "komari-linux-${GOARCH}"

      - name: Upload Docker binary
        uses: actions/upload-artifact@v4
        with:
          name: komari-linux-${{ matrix.goarch }}
          path: komari-linux-${{ matrix.goarch }}

  build-and-push:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker binaries
        uses: actions/download-artifact@v4
        with:
          pattern: komari-linux-*
          path: .
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          no-cache: true
          provenance: false

      - name: Verify image platforms and embedded version
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          manifest="$(docker buildx imagetools inspect "$image")"
          echo "$manifest"
          grep -F 'Platform:  linux/amd64' <<<"$manifest"
          grep -F 'Platform:  linux/arm64' <<<"$manifest"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$image"
            output="$(docker run --rm --platform "$platform" "$image" /app/komari version --json)"
            echo "$output"
            grep -F '"version":"2.1.10-snapshot"' <<<"$output"
            grep -F '"hash":"n4v7c2p"' <<<"$output"
          done
