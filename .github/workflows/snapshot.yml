name: Publish 2.1.11 Storage Snapshot Docker

on:
  workflow_dispatch:
  push:
    branches:
      - snapshot-2.1.11-fix

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION: 2.1.11-snapshot

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure this is the current storage snapshot commit
        shell: bash
        run: |
          set -euo pipefail
          snapshot_branch="snapshot-2.1.11-fix"
          if [ "${GITHUB_REF}" != "refs/heads/${snapshot_branch}" ]; then
            echo "This workflow only publishes refs/heads/${snapshot_branch}. Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "${snapshot_branch}"
          branch_sha="$(git rev-parse FETCH_HEAD)"
          if [ "${GITHUB_SHA}" != "${branch_sha}" ]; then
            echo "A newer storage snapshot commit exists; this run will not publish." >&2
            exit 1
          fi

  build-frontend:
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend
          ref: snapshot-2.1.11-fix

  test-backend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run backend regression suite
        run: go test ./...

  build-linux:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            zig_target: x86_64-linux-musl
          - goarch: arm64
            zig_target: aarch64-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Zig cross-compiler toolchain
        uses: ./.github/actions/setup-zig

      - name: Build Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
        shell: bash
        run: |
          set -euo pipefail
          version_hash="${GITHUB_SHA::7}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${version_hash}" \
            -o "komari-linux-${GOARCH}"

      - name: Upload Docker binary
        uses: actions/upload-artifact@v4
        with:
          name: komari-linux-${{ matrix.goarch }}
          path: komari-linux-${{ matrix.goarch }}

  publish-docker:
    needs: [test-backend, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure commit is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          branch_sha="$(git rev-parse FETCH_HEAD)"
          if [ "${GITHUB_SHA}" != "${branch_sha}" ]; then
            echo "A newer storage snapshot commit exists; Docker publish was skipped." >&2
            exit 1
          fi

      - name: Download Docker binaries
        uses: actions/download-artifact@v4
        with:
          pattern: komari-linux-*
          path: .
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:snapshot
          no-cache: true
          provenance: false

      - name: Verify platforms and embedded version
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:snapshot"
          expected_hash="${GITHUB_SHA::7}"
          manifest="$(docker buildx imagetools inspect "${image}")"
          echo "${manifest}"
          grep -F 'Platform:  linux/amd64' <<<"${manifest}"
          grep -F 'Platform:  linux/arm64' <<<"${manifest}"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "${platform}" "${image}"
            output="$(docker run --rm --platform "${platform}" "${image}" /app/komari version --json)"
            echo "${output}"
            grep -F '\"version\":\"2.1.11-snapshot\"' <<<"${output}"
            grep -F "\"hash\":\"${expected_hash}\"" <<<"${output}"
          done
