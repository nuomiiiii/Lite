name: Publish Storage Snapshot Docker

on:
  workflow_dispatch:
  push:
    branches:
      - snapshot-2.1.11-fix

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure this is the current storage snapshot commit
        shell: bash
        run: |
          set -euo pipefail
          snapshot_branch="snapshot-2.1.11-fix"
          if [ "${GITHUB_REF}" != "refs/heads/${snapshot_branch}" ]; then
            echo "This workflow only publishes refs/heads/${snapshot_branch}. Current ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "${snapshot_branch}"
          branch_sha="$(git rev-parse FETCH_HEAD)"
          if [ "${GITHUB_SHA}" != "${branch_sha}" ]; then
            echo "A newer storage snapshot commit exists; this run will not publish." >&2
            exit 1
          fi

  prepare:
    needs: validate-ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate snapshot version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="Snapshot-$(date -u -d '+8 hours' +%y%m%d%H%M)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Snapshot version: ${version}"

  build-frontend:
    needs: validate-ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend
          ref: snapshot-2.1.11-fix

  test-backend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run backend regression suite
        run: go test ./...

  build-linux:
    needs: [prepare, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            zig_target: x86_64-linux-musl
          - goarch: arm64
            zig_target: aarch64-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Zig cross-compiler toolchain
        uses: ./.github/actions/setup-zig

      - name: Build Linux binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target }}
          GIN_MODE: release
        shell: bash
        run: |
          set -euo pipefail
          version_hash="${GITHUB_SHA::7}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${version_hash}" \
            -o "komari-linux-${GOARCH}"

      - name: Upload Docker binary
        uses: actions/upload-artifact@v4
        with:
          name: komari-linux-${{ matrix.goarch }}
          path: komari-linux-${{ matrix.goarch }}

  publish-docker:
    needs: [prepare, test-backend, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure commit is still current
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          branch_sha="$(git rev-parse FETCH_HEAD)"
          if [ "${GITHUB_SHA}" != "${branch_sha}" ]; then
            echo "A newer storage snapshot commit exists; Docker publish was skipped." >&2
            exit 1
          fi

      - name: Download Docker binaries
        uses: actions/download-artifact@v4
        with:
          pattern: komari-linux-*
          path: .
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:snapshot
          no-cache: true
          provenance: false

      - name: Verify platforms and embedded version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:snapshot"
          expected_hash="${GITHUB_SHA::7}"
          manifest="$(docker buildx imagetools inspect "${image}")"
          echo "${manifest}"
          grep -F 'Platform:  linux/amd64' <<<"${manifest}"
          grep -F 'Platform:  linux/arm64' <<<"${manifest}"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "${platform}" "${image}"
            output="$(docker run --rm --platform "${platform}" "${image}" /app/komari version --json)"
            echo "${output}"
            grep -F "\"version\":\"${VERSION}\"" <<<"${output}"
            grep -F "\"hash\":\"${expected_hash}\"" <<<"${output}"
          done

      - name: Publish snapshot release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: |
            ## 本次更新

            - 升级监控数据库存储结构，进一步减少重复时间轴和块结构带来的空间占用。
            - 延迟与丢包数据改用共享存储，原有查询接口、图表显示和数据精度保持不变。
            - 历史数据改为真正的分层接力，避免不同精度的数据长期重复保存。
            - 升级时提供数据库迁移页面，可查看当前阶段和异常信息；迁移失败会完整回滚，不删除原数据。
            - 兼容上游旧版本、上游 1.3.1，以及 Komari 2.1.7 至 2.1.11 的数据库升级，并保留用户原有的数据保留天数。
            - 数据降采样统一启用并移除低资源模式，旧配置会在升级时自动完成兼容处理。

            ## Docker 快照

            ```bash
            docker pull ghcr.io/nuomiiiii/komari:snapshot
            ```

            支持 `linux/amd64` 和 `linux/arm64`。快照版本仅用于测试，请先备份数据。
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${VERSION}" \
              --notes "${RELEASE_NOTES}" \
              --prerelease
          else
            gh release create "${VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${VERSION}" \
              --notes "${RELEASE_NOTES}" \
              --prerelease
          fi
