name: Rebuild Existing Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version-only GitHub Release tag, for example 2.1.5.
        required: true
        type: string
      version_hash:
        description: Optional seven-character identifier. Leave empty to generate one.
        required: false
        type: string
      server_ref:
        description: Server branch or tag to build.
        required: true
        default: main
        type: string
      frontend_ref:
        description: Lite-web branch or tag. Leave empty to use the same x.y.z tag as this release.
        required: false
        default: ""
        type: string
      theme_ref:
        description: Lite-theme branch or tag. Leave empty to use main.
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: rebuild-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected server source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.server_ref }}
          fetch-depth: 0

      - name: Validate and prepare release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_tag }}
          REQUESTED_HASH: ${{ inputs.version_hash }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          THEME_REF: ${{ inputs.theme_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null

          FRONTEND_REF="${FRONTEND_REF:-$VERSION}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          WEB_REPO="${OWNER}/Lite-web"
          if git ls-remote --exit-code "https://github.com/${WEB_REPO}.git" "refs/tags/${FRONTEND_REF}" >/dev/null; then
            echo "Using Lite-web tag ${FRONTEND_REF}"
          elif git ls-remote --exit-code "https://github.com/${WEB_REPO}.git" "refs/heads/${FRONTEND_REF}" >/dev/null; then
            echo "Using Lite-web branch ${FRONTEND_REF}"
          else
            echo "Lite-web has no tag or branch named ${FRONTEND_REF}. Publish Lite-web ${VERSION} first." >&2
            exit 1
          fi

          WEB_VERSION="$(gh api "repos/${WEB_REPO}/contents/package.json?ref=${FRONTEND_REF}" --jq .content | python3 -c "import json,sys,base64; print(json.loads(base64.b64decode(sys.stdin.read()).decode())['version'])")"
          if [ "$WEB_VERSION" != "$VERSION" ]; then
            echo "Lite-web ${FRONTEND_REF} is version ${WEB_VERSION}, expected ${VERSION}." >&2
            exit 1
          fi

          VERSION_HASH="$REQUESTED_HASH"
          if [ -z "$VERSION_HASH" ]; then
            VERSION_HASH="$(node -e 'const c=require("crypto"),a="abcdefghijklmnopqrstuvwxyz0123456789";let s;do{s=Array.from(c.randomBytes(7),b=>a[b%a.length]).join("")}while(!/[a-z]/.test(s)||!/[0-9]/.test(s));process.stdout.write(s)')"
          fi
          [[ "$VERSION_HASH" =~ ^[A-Za-z0-9]{7}$ ]] || { echo "Invalid version identifier: $VERSION_HASH" >&2; exit 1; }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_hash=$VERSION_HASH" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=$FRONTEND_REF" >> "$GITHUB_OUTPUT"
          echo "theme_ref=${THEME_REF:-main}" >> "$GITHUB_OUTPUT"

      - name: Move version tag to selected source
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "$VERSION" "$(git rev-parse HEAD)"
          git push origin "refs/tags/$VERSION" --force

      - name: Update release build identifier
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_HASH: ${{ steps.metadata.outputs.version_hash }}
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE="$RUNNER_TEMP/release-body.md"
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$BODY_FILE"
          BODY_FILE="$BODY_FILE" VERSION_HASH="$VERSION_HASH" node <<'NODE'
          const fs = require("fs");
          const path = process.env.BODY_FILE;
          const marker = `<!-- lite-version-hash: ${process.env.VERSION_HASH} -->`;
          const body = fs.readFileSync(path, "utf8");
          const pattern = /<!--\s*(?:lite|komari)-version-hash:\s*[A-Za-z0-9]{7}\s*-->/i;
          fs.writeFileSync(path, pattern.test(body) ? body.replace(pattern, marker) : `${marker}\n\n${body}`);
          NODE
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file "$BODY_FILE"

      - name: Dispatch unified release build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          VERSION_HASH: ${{ steps.metadata.outputs.version_hash }}
          FRONTEND_REF: ${{ steps.metadata.outputs.frontend_ref }}
          THEME_REF: ${{ steps.metadata.outputs.theme_ref }}
          SERVER_REF: ${{ inputs.server_ref }}
        shell: bash
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SERVER_REF" \
            -f tag="$VERSION" \
            -f version_hash="$VERSION_HASH" \
            -f web_ref="$FRONTEND_REF" \
            -f theme_ref="$THEME_REF"
